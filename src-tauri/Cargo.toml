[package]
name = "shellman"
version = "0.1.0"
description = "Shellman - a lightweight terminal manager with saved directory sessions"
edition = "2021"
rust-version = "1.80"

[lib]
name = "shellman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
arboard = { version = "3", default-features = false }
base64 = "0.22"
winreg = "0.56"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls"] }
tauri-plugin-process = "2"

[profile.release]
# Optimise for a small, fast binary.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
